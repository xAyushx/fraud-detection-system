<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ledger — live fraud audit stream</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg-void:   #0B0F13;
    --bg-panel:  #131A21;
    --bg-card:   #161D25;
    --ink:       #ECE8DE;
    --ink-dim:   #6E7A87;
    --line:      #232E39;
    --amber:     #E3A008;
    --crimson:   #D6483F;
    --teal:      #47B8AE;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(71,184,174,0.06), transparent),
      var(--bg-void);
    color:var(--ink);
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;}

  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:32px 20px 80px;
  }

  /* ---------- masthead ---------- */
  header.masthead{
    border-bottom:1px solid var(--line);
    padding-bottom:18px;
    margin-bottom:18px;
  }
  .masthead-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px 16px;
  }
  .wordmark{
    font-family:'Newsreader', serif;
    font-weight:600;
    font-size:34px;
    letter-spacing:0.01em;
    margin:0;
  }
  .wordmark em{
    font-style:italic;
    font-weight:500;
    color:var(--ink-dim);
    font-size:0.55em;
    margin-left:2px;
  }
  .subtitle{
    font-size:11.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin:6px 0 0;
  }

  /* ---------- pulse line (signature element) ---------- */
  .pulse-row{
    margin-top:16px;
    height:34px;
    position:relative;
  }
  .pulse-row svg{width:100%;height:100%;display:block;overflow:visible;}
  .pulse-path{
    fill:none;
    stroke:var(--teal);
    stroke-width:1.4;
    stroke-linecap:round;
    stroke-linejoin:round;
    opacity:0.55;
  }
  .pulse-path.block{stroke:var(--crimson);}
  .pulse-path.review{stroke:var(--amber);}
  @media (prefers-reduced-motion: no-preference){
    .pulse-path.animate{
      animation:pulseFlash 900ms ease-out;
    }
  }
  @keyframes pulseFlash{
    0%{opacity:0.15; stroke-width:1.4;}
    18%{opacity:1; stroke-width:2.4;}
    100%{opacity:0.55; stroke-width:1.4;}
  }

  /* ---------- connection + stats ticker ---------- */
  .ticker{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:22px;
    margin-top:14px;
    font-size:12px;
  }
  .status{
    display:flex;
    align-items:center;
    gap:7px;
    font-weight:500;
    letter-spacing:0.04em;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--ink-dim);
    box-shadow:0 0 0 0 transparent;
  }
  .status.live .dot{
    background:var(--teal);
    box-shadow:0 0 0 3px rgba(71,184,174,0.18);
  }
  .status.off .dot{ background:var(--crimson); box-shadow:0 0 0 3px rgba(214,72,63,0.18); }
  .status.connecting .dot{ background:var(--amber); box-shadow:0 0 0 3px rgba(227,160,8,0.18); }

  .stat{display:flex; flex-direction:column; gap:2px;}
  .stat .n{font-size:15px; font-weight:600;}
  .stat .l{font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-dim);}
  .stat .n.amber{color:var(--amber);}
  .stat .n.crimson{color:var(--crimson);}

  /* ---------- config row ---------- */
  .config{
    display:flex;
    gap:8px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .config input{
    flex:1;
    min-width:220px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:inherit;
    font-size:12px;
    padding:9px 11px;
    border-radius:3px;
  }
  .config input:focus-visible{
    outline:2px solid var(--teal);
    outline-offset:1px;
  }
  .config button{
    background:var(--bg-panel);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:inherit;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:9px 16px;
    border-radius:3px;
    cursor:pointer;
  }
  .config button:hover{border-color:var(--teal); color:var(--teal);}
  .config button:focus-visible{ outline:2px solid var(--teal); outline-offset:1px; }

  /* ---------- feed ---------- */
  .feed-label{
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin:28px 0 10px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .feed-label::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }

  .card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-left:3px solid var(--ink-dim);
    border-radius:4px;
    padding:12px 14px;
    margin-bottom:8px;
    display:grid;
    gap:6px;
  }
  .card.block{border-left-color:var(--crimson);}
  .card.review{border-left-color:var(--amber);}
  .card.history{opacity:0.5;}

  @media (prefers-reduced-motion: no-preference){
    .card.enter{ animation:cardEnter 500ms ease-out; }
  }
  @keyframes cardEnter{
    0%{ transform:translateY(-6px); opacity:0; }
    100%{ transform:translateY(0); opacity:1; }
  }

  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .verdict-badge{
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.08em;
    padding:2px 7px;
    border-radius:2px;
    background:var(--bg-panel);
    color:var(--ink-dim);
  }
  .card.block .verdict-badge{ color:var(--crimson); background:rgba(214,72,63,0.12); }
  .card.review .verdict-badge{ color:var(--amber); background:rgba(227,160,8,0.12); }

  .eyebrow{
    font-size:9.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }

  .route{
    font-size:14px;
    font-weight:500;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .route .arrow{color:var(--ink-dim); font-size:12px;}
  .route .acct{color:var(--ink);}

  .meta-row{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    font-size:11px;
    color:var(--ink-dim);
  }
  .meta-row b{color:var(--ink); font-weight:500;}

  .tags{ display:flex; gap:6px; flex-wrap:wrap; }
  .tag{
    font-size:10px;
    padding:2px 7px;
    border-radius:2px;
    border:1px solid var(--line);
    color:var(--ink-dim);
  }

  .empty{
    color:var(--ink-dim);
    font-size:12.5px;
    padding:28px 14px;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:4px;
  }

  footer{
    margin-top:32px;
    font-size:10.5px;
    color:var(--ink-dim);
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="masthead-top">
      <h1 class="wordmark">Ledger<em>live</em></h1>
    </div>
    <p class="subtitle">Graph-based fraud detection · real-time audit stream</p>

    <div class="pulse-row">
      <svg viewBox="0 0 700 34" preserveAspectRatio="none">
        <path id="pulseBase" class="pulse-path" d="M0,17 L700,17"/>
        <path id="pulseSpike" class="pulse-path" d="M0,17 L700,17"/>
      </svg>
    </div>

    <div class="ticker">
      <div class="status connecting" id="statusEl">
        <span class="dot"></span>
        <span id="statusText">CONNECTING</span>
      </div>
      <div class="stat"><span class="n" id="statReceived">–</span><span class="l">Received</span></div>
      <div class="stat"><span class="n" id="statFlagged">–</span><span class="l">Flagged</span></div>
      <div class="stat"><span class="n amber" id="statReview">–</span><span class="l">Review</span></div>
      <div class="stat"><span class="n crimson" id="statBlocked">–</span><span class="l">Block</span></div>
      <div class="stat"><span class="n" id="statRate">–</span><span class="l">Flag rate</span></div>
    </div>

    <div class="config">
      <input id="serverUrl" type="text" value="http://localhost:3000" spellcheck="false" aria-label="Fraud engine server URL" />
      <button id="connectBtn">Connect</button>
    </div>
  </header>

  <div class="feed-label">Live feed</div>
  <div id="feed">
    <div class="empty" id="emptyState">Waiting for alerts — connect to a running fraud engine above.</div>
  </div>

  <footer>Alerts only — ALLOW-verdict transactions aren't broadcast. Replayed history shown dimmed.</footer>
</div>

<script>
(function(){
  const feedEl = document.getElementById('feed');
  const emptyState = document.getElementById('emptyState');
  const statusEl = document.getElementById('statusEl');
  const statusText = document.getElementById('statusText');
  const serverUrlInput = document.getElementById('serverUrl');
  const connectBtn = document.getElementById('connectBtn');
  const pulseSpike = document.getElementById('pulseSpike');

  let es = null;
  let statsTimer = null;
  const MAX_CARDS = 60;

  function setStatus(state, label){
    statusEl.className = 'status ' + state;
    statusText.textContent = label;
  }

  function fmtRelative(ts){
    if(!ts) return '';
    const diff = Date.now() - ts;
    if(diff < 0) return 'just now';
    const s = Math.floor(diff/1000);
    if(s < 5) return 'just now';
    if(s < 60) return s + 's ago';
    const m = Math.floor(s/60);
    if(m < 60) return m + 'm ago';
    const h = Math.floor(m/60);
    return h + 'h ago';
  }

  function verdictClass(v){
    if(v === 'BLOCK') return 'block';
    if(v === 'REVIEW') return 'review';
    return '';
  }

  function spikePulse(cls){
    pulseSpike.setAttribute('class', 'pulse-path ' + cls);
    // build a small spike path so it reads as an EKG-style pulse, not a flat line
    const x = 620 + Math.random()*40;
    pulseSpike.setAttribute('d',
      'M0,17 L' + (x-30) + ',17 L' + (x-20) + ',4 L' + (x-10) + ',30 L' + x + ',17 L700,17'
    );
    // restart animation
    pulseSpike.classList.remove('animate');
    void pulseSpike.offsetWidth;
    pulseSpike.classList.add('animate');
  }

  function renderCard(alert, isHistory){
    const cls = verdictClass(alert.verdict);
    const card = document.createElement('div');
    card.className = 'card ' + cls + (isHistory ? ' history' : ' enter');

    const route = alert.toAccountId
      ? '<span class="acct">' + esc(alert.accountId) + '</span><span class="arrow">→</span><span class="acct">' + esc(alert.toAccountId) + '</span>'
      : '<span class="acct">' + esc(alert.accountId) + '</span>';

    const tags = (alert.flags || []).map(f => '<span class="tag">' + esc(f) + '</span>').join('');
    const when = fmtRelative(alert.detectedAt || alert.timestamp);

    card.innerHTML =
      '<div class="card-top">' +
        '<span class="eyebrow">' + (isHistory ? 'Replayed' : 'Live') + '</span>' +
        '<span class="verdict-badge">' + esc(alert.verdict || '—') + ' · ' + (alert.score ?? '—') + '</span>' +
      '</div>' +
      '<div class="route">' + route + '</div>' +
      '<div class="meta-row">' +
        '<span>tx <b>' + esc(alert.txId || '—') + '</b></span>' +
        '<span>amt <b>' + esc(String(alert.amount ?? '—')) + '</b></span>' +
        '<span>city <b>' + esc(alert.city || '—') + '</b></span>' +
        '<span>' + when + '</span>' +
      '</div>' +
      (tags ? '<div class="tags">' + tags + '</div>' : '');

    return card;
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function addAlert(alert, isHistory){
    if(emptyState) emptyState.remove();
    const card = renderCard(alert, isHistory);
    if(isHistory){
      feedEl.appendChild(card); // history replays in order, oldest last already reversed server-side
    } else {
      feedEl.insertBefore(card, feedEl.firstChild);
      spikePulse(verdictClass(alert.verdict));
    }
    while(feedEl.children.length > MAX_CARDS){
      feedEl.removeChild(feedEl.lastChild);
    }
  }

  function fetchStats(base){
    fetch(base + '/stats').then(r => r.json()).then(s => {
      document.getElementById('statReceived').textContent = s.totalReceived ?? '–';
      document.getElementById('statFlagged').textContent = s.totalFlagged ?? '–';
      document.getElementById('statReview').textContent = s.totalReview ?? '–';
      document.getElementById('statBlocked').textContent = s.totalBlocked ?? '–';
      document.getElementById('statRate').textContent = s.flagRate ?? '–';
    }).catch(() => { /* stats are best-effort; connection status is tracked via SSE */ });
  }

  function connect(){
    const base = serverUrlInput.value.trim().replace(/\/$/, '');
    if(!base) return;

    if(es){ es.close(); }
    if(statsTimer){ clearInterval(statsTimer); }

    feedEl.innerHTML = '';
    setStatus('connecting', 'CONNECTING');

    es = new EventSource(base + '/stream');

    es.onopen = () => setStatus('live', 'LIVE');

    es.onerror = () => {
      setStatus('off', 'OFFLINE — retrying');
    };

    es.onmessage = (evt) => {
      let data;
      try { data = JSON.parse(evt.data); } catch { return; }
      const isHistory = data.type === 'HISTORY';
      addAlert(data, isHistory);
    };

    fetchStats(base);
    statsTimer = setInterval(() => fetchStats(base), 3000);
  }

  connectBtn.addEventListener('click', connect);
  serverUrlInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') connect(); });

  connect();
})();
</script>
</body>
</html>
